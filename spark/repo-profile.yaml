# Project repo profile — generated by /spark-init or customized manually.

default_ship: pr
allow_direct_main: false
default_branch: main
pr_auto_merge: false

plans:
  active_dir: spark/plans/active
  drafts_dir: spark/plans/drafts
  archive_dir: spark/plans/archive
  archive_layout: monthly
  archive_bucket: ship_date
  archive_on: terminal_ship

git_host: auto

pr_gate_skills: []
pr_merge_method: squash
pr_delete_branch: true
pr_wait_for_checks: true
pr_checks_timeout_minutes: 30

changelog_paths:
  - CHANGELOG.md

release_paths:
  - CHANGELOG.md
  - package.json
  - spark/releases/latest.json

deployment:
  hub: custom
  # Coolify builds each app from its multi-stage Dockerfile (Git + Dockerfile pack).
  # See openspec/tech-stack.md § Coolify. Optional later: registry pull-only deploys.

coolify:
  # Provisioned 2026-10-10 via Coolify CLI 1.8.0 (context: home). See openspec/changes/provision-coolify-test-env.
  context: home
  instance_url: "http://host.docker.internal:8000"
  # CLI note: `coolify version` → 1.8.0 (update available 1.9.0). Garage create needed API (CLI --list-types stale vs API).
  team_id: 0
  project_uuid: "rx35b6552e0csdcmqffv5ycv"
  server_uuid: "jgokede0e0ic2nld9gls8cqi"
  build_pack: dockerfile
  # Per-app Dockerfile paths when apps[] is filled, e.g. apps/api/Dockerfile (context: repo root).
  #
  # Environments:
  #   test        — shared integration plane for agents/CI (Postgres, Garage; later search/graph; apps via API/MCP)
  #   qa          — human/staging (not created yet in Coolify — create when needed)
  #   production  — Coolify default env on project
  # Do NOT start infra/docker-compose on the Coolify host from agents (port clashes). Laptops may use docker:local:*.
  #
  # Public URL schema (one DNS label before the zone — fits wildcard TLS):
  #   production: https://hw-<role>.home.mlk     covered by cert *.home.mlk
  #   test:       https://hw-<role>.test.home.mlk covered by cert *.test.home.mlk
  # Roles: web | api | worker | mcp | story | docs | chat | …. Same pattern for other projects (e.g. voc-api.home.mlk).
  # Exception: docs production FQDN is https://docs-hw.home.mlk (operator-chosen; not hw-docs.home.mlk).
  # Do NOT use nested hosts like api.hw.home.mlk — public CAs only wildcard one label level.
  # Storybook is production-only: https://hw-story.home.mlk (no *.test.home.mlk).
  environments:
    - slug: test
      name: test
      purpose: agent_ci_integration
      uuid: "jcuktxc8fkxljvvrtcofiu23"
      data_plane:
        - postgres
        - object_storage
        # later: search, knowledge_graph
      resources:
        postgres_uuid: "uajgxibw9cp5bbk0ftpozngg"
        # DATABASE_URL intent: postgresql://helloworld:helloworld@<coolify-internal-host>:5432/helloworld
        # (resolve host from Coolify DB network / service name helloworld-test-postgres)
        garage_uuid: "wkcfjdulstfgbjcrmndvygup"
        # Coolify service: helloworld-test-garage (dxflrs/garage). Map to app S3_* (do not commit secrets):
        #   S3_ENDPOINT          <- GARAGE_S3_API_URL (public S3 API host on Coolify)
        #   S3_REGION            <- us-east-1 (SDK required; Garage ignores)
        #   S3_ACCESS_KEY_ID     <- SERVICE_USER_GARAGE / GARAGE_DEFAULT_ACCESS_KEY
        #   S3_SECRET_ACCESS_KEY <- SERVICE_PASSWORD_64_GARAGE / GARAGE_DEFAULT_SECRET_KEY
        #   S3_BUCKET            <- GARAGE_DEFAULT_BUCKET (default)
        #   S3_FORCE_PATH_STYLE  <- true
        # Resolve values: `coolify service env list <garage_uuid> --context home -s --format json`
        # Start if exited: `coolify service start <garage_uuid> --context home`
      app_plane:
        - api
        - worker
        - mcp
        - web
        # later: docs (prod only for now), chat, … (storybook is production-only)
    - slug: qa
      name: qa
      purpose: staging
      # uuid: create with `coolify project environments create <project_uuid> --name qa` when needed
    - slug: production
      name: production
      purpose: production
      uuid: "gupklxhd6mmcbhahjbag5a0i"
      data_plane:
        - postgres
        - object_storage
        # later: search, knowledge_graph (Typesense + AGE image pin)
      resources:
        postgres_uuid: "tskrqcfbostuhcjcpcjihu4d"
        # DATABASE_URL intent: postgresql://helloworld:helloworld@tskrqcfbostuhcjcpcjihu4d:5432/helloworld
        garage_uuid: "kf8xfkq2dn5yl21s1ntnsg6g"
        # Resolve S3_*: `coolify service env list <garage_uuid> --context home -s --format json`
      app_plane:
        - api
        - worker
        - mcp
        - web
        - docs
        - storybook
        # later: chat, …
  apps:
    # Dockerfile build pack; base_directory=/; dockerfile_location as below. Git branch may be automation branch until merge.
    # Health: Coolify HTTP GET /health (api/worker/mcp); web/docs/storybook GET /.
    # Api migrate: image entrypoint runs `pnpm exec drizzle-kit migrate` (same as local `pnpm db:migrate`); set SKIP_DB_MIGRATE=1 to skip.
    # Blockers: Postgres is stock postgres:18 (no AGE pin yet); Typesense not provisioned —
    # api/worker default TYPESENSE_HOST/API_KEY to empty so /health skips search until provisioned.
    # Local Compose still sets TYPESENSE_* via root `.env` / `.env.example`.
    # Chat Application deferred (not in app_plane).
    - id: api
      environment: test
      uuid: "1gyl2jk6yy6n6wv6ayq4tdf5"
      dockerfile: apps/api/Dockerfile
      ports_exposes: "3000"
      health_path: /health
      fqdn: "https://hw-api.test.home.mlk"
    - id: worker
      environment: test
      uuid: "z7hxg0wgeqaa4pfgfwb4wwwj"
      dockerfile: apps/worker/Dockerfile
      ports_exposes: "3001"
      health_path: /health
      fqdn: "https://hw-worker.test.home.mlk"
    - id: mcp
      environment: test
      uuid: "s5hjawvuqi0yxc8bpayb3bod"
      dockerfile: apps/mcp/Dockerfile
      ports_exposes: "3100"
      health_path: /health
      fqdn: "https://hw-mcp.test.home.mlk"
    - id: web
      environment: test
      uuid: "nuzin6mut8c2banzrisgopta"
      dockerfile: apps/web/Dockerfile
      ports_exposes: "5173"
      health_path: /
      fqdn: "https://hw-web.test.home.mlk"
    - id: api
      environment: production
      uuid: "0pi9uaqrrylsfipudj9ugeoz"
      dockerfile: apps/api/Dockerfile
      ports_exposes: "3000"
      health_path: /health
      fqdn: "https://hw-api.home.mlk"
    - id: worker
      environment: production
      uuid: "geozjacsua4dpqkfqggccw5a"
      dockerfile: apps/worker/Dockerfile
      ports_exposes: "3001"
      health_path: /health
      fqdn: "https://hw-worker.home.mlk"
    - id: mcp
      environment: production
      uuid: "f9vajdggqildlegjkw93h7rm"
      dockerfile: apps/mcp/Dockerfile
      ports_exposes: "3100"
      health_path: /health
      fqdn: "https://hw-mcp.home.mlk"
    - id: web
      environment: production
      uuid: "bbtfah680f7slela7ffcfrzo"
      dockerfile: apps/web/Dockerfile
      ports_exposes: "5173"
      health_path: /
      fqdn: "https://hw-web.home.mlk"
    # Hostname exception vs hw-<role>.home.mlk — operator-chosen docs-hw.home.mlk
    - id: docs
      environment: production
      uuid: "itnxaioyujl9vtakhd9rnryo"
      dockerfile: apps/docs/Dockerfile
      ports_exposes: "4000"
      health_path: /
