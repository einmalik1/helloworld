    - id: storybook
      environment: production
      uuid: "vzcbdrcl1oxe8jtoqurqyzqv"
      dockerfile: apps/storybook/Dockerfile
      ports_exposes: "6006"
      health_path: /
      fqdn: "https://hw-story.home.mlk"

release:
  name: helloworld
  changelog_section: Releases
  tag_prefix: helloworld
  version_path: package.json
  manifest_path: spark/releases/latest.json
  notes_dir: spark/releases/notes
  homebrew:
    package_name: helloworld

doc_feature_paths:
  - openspec/features/

doc_architecture_paths:
  - AGENTS.md
  - openspec/architecture.md
  - openspec/tech-stack.md

doc_domain_paths:
  - CONTEXT.md
  - openspec/decisions/

doc_publish_defaults:
  - repo

telemetry:
  enabled: false

# Schema / ERD / docs / types codegen — SoT for generator config (categories + per-stage knobs).
# DDL SoT remains openspec/data-model/schema.sql; tables assign category keys via COMMENT ON TABLE.
generators:
  schema_sql: openspec/data-model/schema.sql
  schema_model: openspec/data-model/generated/schema-model.json
  categories:
    - key: core
      label: Core
      color: "#2563eb"
    - key: social
      label: Social
      color: "#059669"
    - key: chat
      label: Chat
      color: "#d97706"
    - key: infra
      label: Infra
      color: "#64748b"
  erd:
    enabled: true
    out_dir: openspec/data-model/generated
    nicht_crud_katalog: openspec/data-model/nicht-crud-katalog.md
    audit_fk_columns:
      - created_by
      - updated_by
      - granted_by
      - revoked_by
      - changed_by
      - actor_id
  docs:
    enabled: true
    out_dir: openspec/data-model/generated/docs
  types:
    enabled: true
    out_dirs:
      # Artifact copy under ERD generated/ is fine; package source uses schema/ (not a "generated/" folder).
      - openspec/data-model/generated/types
      - packages/types/src/schema
  api:
    enabled: true
    out_dir: packages/types/src/api
    # Plus PK columns that have a DB default (e.g. gen_random_uuid).
    create_omit_columns:
      - created_at
      - updated_at
  nest_dto:
    enabled: true
    out_dir: apps/api/src
    import_types_from: "@helloworld/types/api"
  drizzle:
    enabled: true
    out_dir: packages/modules/src/database/schema

rules_paths:
  always:
    - AGENTS.md
    - spark/agents/common/

repo:
  name: Hello World
  id: helloworld
  package_scope: helloworld
  cli_binary: helloworld
  package_manager: pnpm
  monorepo_tool: turbo

packages:
  - id: api
    path: apps/api
    role: api
    layer: 1
  - id: worker
    path: apps/worker
    role: api
    layer: 1
  - id: mcp
    path: apps/mcp
    role: api
    layer: 1
  - id: web
    path: apps/web
    role: client
    layer: 1
    depends_on:
      - api
  - id: docs
    path: apps/docs
    role: client
    layer: 1
  - id: storybook
    path: apps/storybook
    role: client
    layer: 1
  - id: cli
    path: tools/cli
    role: cli
    layer: 1
    depends_on:
      - api
      - worker
  - id: tui
    path: tools/tui
    role: cli
    layer: 1
    depends_on:
      - api
      - worker
  - id: e2e
    path: tests/e2e
    role: e2e
    layer: 2
    depends_on:
      - web
      - api

execution:
  layer_order:
    - api
    - worker
    - mcp
    - web
    - docs
    - storybook
    - cli
    - tui
    - e2e
  tdd: true
  implement_review: true
  implement_review_retries: 2
  verification_skills: []
  full_gate_skills: []
  e2e_skills: []

review:
  architecture:
    boundaries: apps (services) → tools (clients); tests depend on running services; packages are shared libs.
    shared_packages:
      - packages/types
      - packages/modules
      - packages/terminal
      - packages/api-client
      - packages/ui
      - packages/config
  security:
    tags:
      - auth
      - injection
      - secrets
      - validation
      - xss
      - cors
  dependency:
    lockfile: pnpm-lock.yaml
    workspace_roots:
      - apps
      - tools
      - packages
      - tests

ship:
  release_confirm: true
  release_preview: service
  post_deploy: false
  post_deploy_after: terminal_merge
  post_deploy_skills: []

orca:
  board_statuses:
    planning: planning
    review: review
    development: development
    testing: testing
    deployment: deployment
    done: done

tickets:
  labels:
    plan:
      name: plan
      description: "Stage: queued for planner."
      color: "3a426e"
    planning:
      name: planning
      description: "Stage: planner drafting."
      color: "1d76db"
    review:
      name: review
      description: "Stage: human gate (plan, code, or analysis)."
      color: "d4c5f9"
    ready_for_implementation:
      name: ready-for-implementation
      description: "Stage: human approved; waiting for developer."
      color: "0e8a16"
    development:
      name: development
      description: "Stage: developer implementing."
      color: "1d76db"
    testing:
      name: testing
      description: "Stage: tests running / fixing."
      color: "fbca04"
    ready_for_deployment:
      name: ready-for-deployment
      description: "Stage: human approved release."
      color: "5319e7"
    deployment:
      name: deployment
      description: "Stage: commit / PR / deploy in progress."
      color: "000000"
    done:
      name: done
      description: "Stage: finished; Sweep may clean up."
      color: "cfd3d7"
    feature:
      name: feature
      description: "Kind: feature wish."
      color: "fbca04"
    bug:
      name: bug
      description: "Kind: bug."
      color: "d73a4a"
    refactor:
      name: refactor
      description: "Kind: Daily Review refactor finding."
      color: "cfd3d7"
    docs:
      name: docs
      description: "Kind: Daily Review docs finding."
      color: "0075ca"
    security:
