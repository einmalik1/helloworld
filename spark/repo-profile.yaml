# Project repo profile — generated by /spark-init or customized manually.

default_ship: pr
allow_direct_main: false
default_branch: main
pr_auto_merge: false

plans:
  active_dir: spark/plans/active
  drafts_dir: spark/plans/drafts
  archive_dir: spark/plans/archive
  archive_layout: monthly
  archive_bucket: ship_date
  archive_on: terminal_ship

git_host: auto

pr_gate_skills: []
pr_merge_method: squash
pr_delete_branch: true
pr_wait_for_checks: true
pr_checks_timeout_minutes: 30

changelog_paths:
  - CHANGELOG.md

release_paths:
  - CHANGELOG.md
  - package.json
  - spark/releases/latest.json

deployment:
  hub: custom
  # Coolify builds each app from its multi-stage Dockerfile (Git + Dockerfile pack).
  # See spec/tech-stack.md § Coolify. Optional later: registry pull-only deploys.

coolify:
  # Fill UUIDs and context once Coolify projects exist.
  context: ""
  instance_url: ""
  team_id: 0
  project_uuid: ""
  build_pack: dockerfile
  # Per-app Dockerfile paths when apps[] is filled, e.g. apps/api/Dockerfile (context: repo root).
  environments:
    - slug: production
      name: production
    - slug: qa
      name: qa
  apps: []

release:
  name: helloworld
  changelog_section: Releases
  tag_prefix: helloworld
  version_path: package.json
  manifest_path: spark/releases/latest.json
  notes_dir: spark/releases/notes
  homebrew:
    package_name: helloworld

doc_feature_paths:
  - spec/features/

doc_architecture_paths:
  - agents.md
  - spec/architecture.md
  - spec/tech-stack.md

doc_domain_paths:
  - CONTEXT.md
  - spec/decisions/

doc_publish_defaults:
  - repo

telemetry:
  enabled: false

rules_paths:
  always:
    - agents.md
    - spark/agents/common/

repo:
  name: Hello World
  id: helloworld
  package_scope: helloworld
  cli_binary: helloworld
  package_manager: pnpm
  monorepo_tool: turbo

packages:
  - id: api
    path: apps/api
    role: api
    layer: 1
  - id: worker
    path: apps/worker
    role: api
    layer: 1
  - id: mcp
    path: apps/mcp
    role: api
    layer: 1
  - id: web
    path: apps/web
    role: client
    layer: 1
    depends_on:
      - api
  - id: docs
    path: apps/docs
    role: client
    layer: 1
  - id: storybook
    path: apps/storybook
    role: client
    layer: 1
  - id: cli
    path: tools/cli
    role: cli
    layer: 1
    depends_on:
      - api
      - worker
  - id: tui
    path: tools/tui
    role: cli
    layer: 1
    depends_on:
      - api
      - worker
  - id: e2e
    path: tests/e2e
    role: e2e
    layer: 2
    depends_on:
      - web
      - api

execution:
  layer_order:
    - api
    - worker
    - mcp
    - web
    - docs
    - storybook
    - cli
    - tui
    - e2e
  tdd: true
  implement_review: true
  implement_review_retries: 2
  verification_skills: []
  full_gate_skills: []
  e2e_skills: []

review:
  architecture:
    boundaries: apps (services) → tools (clients); tests depend on running services; packages are shared libs.
    shared_packages:
      - packages/types
      - packages/modules
      - packages/terminal
      - packages/api-client
      - packages/config
  security:
    tags:
      - auth
      - injection
      - secrets
      - validation
      - xss
      - cors
  dependency:
    lockfile: pnpm-lock.yaml
    workspace_roots:
      - apps
      - tools
      - packages
      - tests

ship:
  release_confirm: true
  release_preview: service
  post_deploy: false
  post_deploy_after: terminal_merge
  post_deploy_skills: []

orca:
  board_statuses:
    planning: planning
    review: review
    development: development
    testing: testing
    deployment: deployment
    done: done

tickets:
  labels:
    plan:
      name: plan
      description: "Stage: queued for planner."
      color: "3a426e"
    planning:
      name: planning
      description: "Stage: planner drafting."
      color: "1d76db"
    review:
      name: review
      description: "Stage: human gate (plan, code, or analysis)."
      color: "d4c5f9"
    ready_for_implementation:
      name: ready-for-implementation
      description: "Stage: human approved; waiting for developer."
      color: "0e8a16"
    development:
      name: development
      description: "Stage: developer implementing."
      color: "1d76db"
    testing:
      name: testing
      description: "Stage: tests running / fixing."
      color: "fbca04"
    ready_for_deployment:
      name: ready-for-deployment
      description: "Stage: human approved release."
      color: "5319e7"
    deployment:
      name: deployment
      description: "Stage: commit / PR / deploy in progress."
      color: "000000"
    done:
      name: done
      description: "Stage: finished; Sweep may clean up."
      color: "cfd3d7"
    feature:
      name: feature
      description: "Kind: feature wish."
      color: "fbca04"
    bug:
      name: bug
      description: "Kind: bug."
      color: "d73a4a"
    refactor:
      name: refactor
      description: "Kind: Daily Review refactor finding."
      color: "cfd3d7"
    docs:
      name: docs
      description: "Kind: Daily Review docs finding."
      color: "0075ca"
    security:
      name: security
      description: "Kind: Daily Review security finding."
      color: "b60205"
