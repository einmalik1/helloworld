# Local data plane for Hello World — Postgres + MinIO (S3-compatible).
# Start from repo root: pnpm run docker:local:up
# Credentials/ports align with root `.env.example`.

services:
  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: helloworld
      POSTGRES_PASSWORD: helloworld
      POSTGRES_DB: helloworld
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helloworld -d helloworld"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - helloworld_pg_data:/var/lib/postgresql/data

  s3:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - helloworld_s3_data:/data

volumes:
  helloworld_pg_data:
  helloworld_s3_data:
