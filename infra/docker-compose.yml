# Local data plane for Hello World — Postgres + Typesense + MinIO (S3-compatible).
# Start from repo root: pnpm run docker:local:up
# Credentials/ports align with root `.env.example`.
# AGE: stock postgres:18 is fine for CRUD; graph features need an AGE-enabled image
# (see openspec/tech-stack.md § Search / knowledge graph + infra/postgres).

services:
  postgres:
    image: postgres:18
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: helloworld
      POSTGRES_PASSWORD: helloworld
      POSTGRES_DB: helloworld
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helloworld -d helloworld"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - helloworld_pg_data:/var/lib/postgresql/data

  typesense:
    image: typesense/typesense:27.1
    command: ["--data-dir", "/data", "--api-key", "change-me-typesense-local", "--enable-cors"]
    ports:
      - "8108:8108"
    volumes:
      - helloworld_typesense_data:/data
    healthcheck:
      test: ["CMD-SHELL", "exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5

  s3:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - helloworld_s3_data:/data

volumes:
  helloworld_pg_data:
  helloworld_typesense_data:
  helloworld_s3_data:
